name: Perbarui TLE harian

# Mengunduh TLE terbaru dari CelesTrak setiap hari dan menyimpannya ke data/tle_cadangan.txt.
# Aplikasi membaca file ini (lewat raw.githubusercontent.com) bila CelesTrak tidak terjangkau.
on:
  schedule:
    - cron: "23 22 * * *"   # 22:23 UTC = 05:23 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unduh TLE
        run: |
          pip install --quiet requests==2.34.2
          python scripts/perbarui_tle.py

      - name: Commit bila berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tle_cadangan.txt
          git diff --cached --quiet || git commit -m "Perbarui TLE harian"
          git push
